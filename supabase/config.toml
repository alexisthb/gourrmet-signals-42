# Fonctions cible de crons pg_net SANS header Authorization : verify_jwt DOIT être
# false. Elles manquaient ici -> un déploiement piloté par config.toml les aurait
# basculées à true (défaut) => 401 silencieux, queue d'enrichissement jamais dépilée
# et logos Manus jamais récoltés (audit Fable, confirmé).
