# Le gate de qualité, exécuté par la machine plutôt que par la mémoire.
#
# Jusqu'ici `npm run verify` et `npm run test:sql` ne tournaient que si
# quelqu'un y pensait — alors que le dépôt reçoit des commits de deux sources
# (les agents Lovable et le travail direct), et que deux incidents en trois
# jours sont nés d'un correctif jamais éprouvé.
#
# Le banc SQL est le plus lent (deux passes sur une base PostgreSQL éphémère)
# et le plus précieux : c'est lui qui a attrapé la parenthèse manquante et le
# CASE non parenthésé qui auraient interrompu la mise en service en plein
# milieu. Il tourne donc à chaque fois, pas seulement à la demande.

name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Types, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Le lock est resynchronisé depuis le 22/08 : `npm ci` fonctionne et
      # garantit l'installation EXACTE du lock — celle que verra le build.
      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      # Le typecheck ne prouve pas que le site se construit : Vite a ses
      # propres échecs (imports d'assets, chunks, plugins). Un gate qui ne
      # construit pas laisse passer une régression de build jusqu'au
      # déploiement — où elle devient une page blanche.
      - name: Build de production
        run: npm run build

      - name: Tests unitaires
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Ces tests couvrent les fonctions edge, c'est-à-dire tout ce qui parle
      # aux fournisseurs payants. Ils incluent le typecheck Deno du module
      # partagé, que `tsc` ne voit pas.
      - name: Tests edge
        run: npm run test:edge

      # Le lint porte une dette héritée assumée. On vérifie qu'elle n'AUGMENTE
      # pas, plutôt que d'exiger zéro et de désactiver la règle au premier
      # commit pressé.
      #
      # PIÈGE CORRIGÉ LE 22/08 : la première version faisait
      # `set -o pipefail` puis `eslint | node`. ESLint sort en code 1 dès
      # qu'il y a des erreurs — donc TOUJOURS, à cause de la dette acceptée —
      # et pipefail tuait le step avant que la comparaison à la baseline ait
      # pu l'accepter. Les 11 premières exécutions du Gate ont échoué ainsi :
      # un contrôle mécaniquement incapable de passer, ce qui apprend à tout
      # le monde à ignorer le rouge. ESLint écrit désormais son rapport dans
      # un fichier (`-o` écrit même en cas d'erreurs), et seul un CRASH
      # d'ESLint (pas de rapport produit) fait échouer le step.
      - name: Lint (sans régression au-delà de la dette connue)
        run: |
          npx eslint . -f json -o /tmp/eslint-report.json || true
          if [ ! -s /tmp/eslint-report.json ]; then
            echo "::error::ESLint n'a produit aucun rapport : crash de lint, pas une dette."
            exit 1
          fi
          ERREURS=$(node -e "const r=require('/tmp/eslint-report.json');console.log(r.reduce((n,f)=>n+f.errorCount,0))")
          echo "Erreurs de lint : $ERREURS (dette acceptée : 205)"
          if [ "$ERREURS" -gt 205 ]; then
            echo "::error::Le lint régresse : $ERREURS erreurs contre 205 acceptées."
            exit 1
          fi

  sql:
    name: Banc SQL (migrations + contrats)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Le banc rejoue TOUTE la chaîne de migrations sur une base vierge, puis
      # la rejoue une seconde fois pour vérifier l'idempotence — et exécute
      # ensuite les contrats, qui APPELLENT les fonctions au lieu de se
      # contenter de les créer. C'est cette distinction qui a manqué le
      # 2026-08-22, quand une migration fautive est passée au vert.
      - name: PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-contrib-16

      - name: Banc SQL
        run: |
          sudo useradd -m pgtest 2>/dev/null || true
          sudo -E PGBIN=/usr/lib/postgresql/16/bin bash supabase/tests/run-sql-tests.sh
